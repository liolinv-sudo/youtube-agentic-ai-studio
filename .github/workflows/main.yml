on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
- name: Upload generated video
  uses: actions/upload-artifact@v4
  with:
    name: generated-video
    path: output/          # Ändra till din faktiska videokatalogsökväg
    retention-days: 7      # Behåll i 7 dagar, justera själv
    if-no-files-found: warn  # Varna men misslyckas inte när fil saknas
